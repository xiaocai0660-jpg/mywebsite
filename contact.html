<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="icon" type="image/png" href="02.png">

<style>
    body {
        font-family: Arial;
        margin: 0;
        background: #f7f8fa;
    }

    header {
        background: #001e5c;
        padding: 20px 50px;
        color: white;
    }

    header nav a {
        color: white;
        text-decoration: none;
        margin-right: 25px;
        font-size: 15px;
    }

    header nav a:hover {
        opacity: 0.85;
    }

    h1 {
        text-align: left;
        margin: 20px 50px;
        font-size: 30px;
        color: #001e5c;
    }

    .container {
        width: 90%;
        max-width: 1100px;
        margin: auto;
        background: white;
        padding: 40px;
        box-shadow: 0px 3px 10px rgba(0,0,0,0.1);
        border-radius: 8px;
    }

    label {
        font-weight: bold;
        display: block;
        margin-top: 20px;
        color: #333;
    }

    input, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        margin-top: 8px;
        border-radius: 4px;
    }

    button {
        margin-top: 25px;
        background: #001e5c;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
    }

    button:hover {
        opacity: 0.85;
    }

    footer {
        margin-top: 50px;
        background: #001e5c;
        color: white;
        text-align: center;
        padding: 20px 10px;
        font-size: 14px;
    }

    .whatsapp {
        margin-top: 25px;
    }

    .whatsapp a {
        color: #001e5c;
        text-decoration: none;
        font-weight: bold;
    }

</style>
</head>

<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="investment.html">Investment Plans</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<h1>Contact Us</h1>

<div class="container">

    <h2>Get in Touch</h2>

    <!-- 🔥 一次性完整 FormSubmit 表单 -->
    <form action="https://formsubmit.co/test@gmail.com" method="POST">

        <!-- 禁止机器人 -->
        <input type="hidden" name="_captcha" value="false">

        <!-- 提交后跳转回 contact.html -->
        <input type="hidden" name="_next" value="https://xiaocai0660-jpg.github.io/mywebsite/contact.html">

        <label>Your Name</label>
        <input type="text" name="name" placeholder="Enter your full name" required>

        <label>Your Email</label>
        <input type="email" name="email" placeholder="Enter your email address" required>

        <label>Your Message</label>
        <textarea name="message" placeholder="Write your message..." required></textarea>

        <button type="submit">Submit Message</button>
    </form>

    <div class="whatsapp">
        <p>Or reach us directly on WhatsApp:</p>
        <a href="https://wa.me/919601271770" target="_blank">📲 Chat on WhatsApp</a>
    </div>

</div>

<footer>
    © 2025 BR Jalan Securities Private Limited — All Rights Reserved
</footer>

</body>
</html>
