<!DOCTYPE html>
<html>
<head>

    <title>Contact</title>
<link rel="icon" type="image/png" href="02.png">
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f7f8fa;

        .wrapper {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        header {
            background: #051b43;
            color: white;
        }

        }

        .section {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 8px;
            box-shadow: 0px 1px 3px rgba(0,0,0,0.1);
        }

        footer {
            text-align: center;
            padding: 40px 0;
            font-size: 14px;
            color: #666;
        }

        input, textarea {
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #051b43;
            color: white;
            padding: 10px 28px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {

<header>

<nav class="wrapper">
