<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <!-- Website Icon -->
    <link rel="icon" type="image/png" href="02.png">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f7f8fa;
        }

        header {
            background: #001e5c;
            color: white;
        }

        header h1 {
            margin: 0;
            padding: 25px 20px;
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-size: 15px;
        }

        nav {
            padding: 10px 20px;
            background: #001e5c;
        }

        .container {
            width: 80%;
            margin: auto;
            padding: 50px 0;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 15px;
            margin-bottom: 8px;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            font-size: 15px;
            border-radius: 3px;
        }

        textarea {
            height: 120px;
        }

        button {
            background: #001e5c;
            color: white;
            padding: 12px 22px;
            font-size: 15px;
            border: none;
            margin-top: 18px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            opacity: 0.85;
        }

        .bottom-info {
            margin-top: 30px;
            font-size: 15px;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 15px 0;
            background: #001e5c;
            color: white;
            margin-top: 60px;
            font-size: 14px;
        }

        .whatsapp-link {
            margin-top: 10px;
            display: inline-block;
            color: #001e5c;
            font-weight: bold;
        }

        .whatsapp-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <header>
        <h1>Contact Us</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="investment.html">Investment Plans</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h2>Get in Touch</h2>

        <!-- FORM START -->
        <form action="https://formsubmit.co/YOUR_EMAIL_HERE" method="POST">

            <input type="hidden" name="_captcha" value="false">

            <label>Your Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>

            <label>Your Email</label>
            <input type="email" name="email" placeholder="Enter your email address" required>

            <label>Your Message</label>
            <textarea name="message" placeholder="Write your message..." required></textarea>

            <button type="submit">Submit Message</button>
        </form>
        <!-- FORM END -->

        <div class="bottom-info">
            Or reach us directly on WhatsApp:<br><br>
            <a class="whatsapp-link" href="https://wa.me/919601271770" target="_blank">💬 Chat on WhatsApp</a>
        </div>
    </div>

    <footer>
        © 2025 BR Jalan Securities Private Limited — All Rights Reserved
    </footer>

</body>
</html>
